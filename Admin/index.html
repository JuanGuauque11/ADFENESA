<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADFENESA — Acceso Admin</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body class="login-body">

  <div class="login-wrapper">

    <div class="login-brand">
      <img src="LOGOS/LOGO-HEADER.svg" alt="Logo ADFENESA" class="login-logo" />
      <span class="login-badge">ADMINISTRADOR</span>
    </div>

    <div class="login-card">
      <h1 class="login-title">Acceso al panel</h1>
      <p class="login-subtitle">Ingresa tus credenciales para continuar</p>

      <div id="login-error" class="login-error hidden">
        <span id="login-error-msg">Correo o contraseña incorrectos.</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Correo electrónico</label>
        <input
          class="form-input"
          type="email"
          id="email"
          placeholder="admin@adfenesa.com"
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <div class="input-password-wrapper">
          <input
            class="form-input"
            type="password"
            id="password"
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <button class="toggle-password" id="toggle-password" type="button" aria-label="Mostrar contraseña">
            <svg id="icon-eye" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="hidden"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <button class="btn-login" id="btn-login">
        <span id="btn-login-text">INGRESAR</span>
        <span id="btn-login-loader" class="btn-loader hidden"></span>
      </button>

      <a href="../../index.html" class="login-back">← Volver al sitio</a>
    </div>

  </div>

  <!-- Firebase SDK -->
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="login.js"></script>
</body>
</html>
